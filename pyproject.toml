[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tilavet-phonemizer"
version = "0.2.0"
description = "Rule-based Quran phonemizer for offline audio alignment and tajwid analysis."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Tilavet" }]
license = { text = "MIT" }
keywords = [
    "quran",
    "phonemizer",
    "tajwid",
    "arabic",
    "phonetics",
    "alignment",
    "speech-recognition",
    "ctc",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Natural Language :: Arabic",
]

[project.urls]
Homepage = "https://github.com/tialkan/tilavet-phonemizer"
Documentation = "https://github.com/tialkan/tilavet-phonemizer#readme"
Repository = "https://github.com/tialkan/tilavet-phonemizer"
Issues = "https://github.com/tialkan/tilavet-phonemizer/issues"

[project.scripts]
tilavet-phonemize = "tilavet_phonemizer.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.12",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

